<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Dual Space myXL</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
        }

        .btn-group {
            margin-top: 20px;
            margin-bottom: 30px;
        }

        .btn-server {
            padding: 12px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            margin: 5px;
            display: inline-block;
            transition: background-color 0.2s ease-in-out;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .btn-server:hover {
            background-color: #0056b3;
        }

        .info-card {
            background-color: #1e1e1e;
            border-radius: 10px;
            padding: 20px;
            max-width: 400px;
            margin: 0 auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }

        .info-card h4 {
            margin-top: 0;
            color: #007bff;
        }

        .info-card p {
            font-size: 14px;
            color: #ccc;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <h2>Web Dual Space myXL</h2>

    <!-- Tombol Server Link Langsung Appetize -->
    <div class="btn-group">
        <span style="display: block; margin-bottom: 12px; font-weight: bold; font-size: 16px;">Pilih Server untuk Membuka myXL:</span>
        <a href="https://appetize.io/app/b_3hqtdqgx7frucwfhd6qdzkjoia" target="_blank" class="btn-server">Server 1 (100m)</a>
        <a href="https://appetize.io/app/b_3hqtdqgx7frucwfhd6qdzkjoia" target="_blank" class="btn-server">Server 2 (100m)</a>
        <a href="https://appetize.io/app/b_3hqtdqgx7frucwfhd6qdzkjoia" target="_blank" class="btn-server">Server 3 (100m)</a>
    </div>

    <!-- Informasi Penggunaan -->
    <div class="info-card">
        <h4>Petunjuk Penggunaan</h4>
        <p>Klik salah satu tombol server di atas untuk menjalankan emulator aplikasi myXL langsung di tab baru browser kamu secara cepat dan lancar tanpa kendala pemblokiran sematan.</p>
    </div>

</body>
</html>
